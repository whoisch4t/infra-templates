version: 2
updates:
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories: ["/terraform/bootstrap", "/terraform/envs/demo", "/terraform/modules/*"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
